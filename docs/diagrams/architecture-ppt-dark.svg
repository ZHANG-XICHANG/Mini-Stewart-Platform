<title id="architecture-ppt-dark-title">Mini Stewart 平台控制架構</title>
<desc id="architecture-ppt-dark-desc">PC 上位機以 USB 序列傳送六軸姿態封包，ESP32-C6 校驗後計算逆運動學並轉成脈寬，經 PCA9685 驅動六組伺服；逾時則回中位。</desc>

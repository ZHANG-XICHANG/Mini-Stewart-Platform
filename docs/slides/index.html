<h1 id="span-classnum01span%E7%A0%94%E7%A9%B6%E5%8B%95%E6%A9%9F%E8%88%87%E8%A8%AD%E8%A8%88%E7%9B%AE%E6%A8%99"><span class="num">01</span>研究動機與設計目標</h1>
<h2 id="%E6%8A%8A%E5%85%A8%E5%B0%BA%E5%AF%B8%E5%8B%95%E6%85%8B%E6%A8%A1%E6%93%AC%E5%B9%B3%E5%8F%B0%E7%B8%AE%E5%B0%8F%E4%B8%A6%E8%AE%93%E6%8E%A7%E5%88%B6%E5%99%A8%E8%87%AA%E5%B7%B1%E5%AE%8C%E6%88%90%E9%81%8B%E5%8B%95%E5%AD%B8%E8%A7%A3%E7%AE%97">把全尺寸動態模擬平台縮小，並讓控制器自己完成運動學解算</h2>
<div class="cols">
<div>
<h3 id="%E5%8B%95%E6%A9%9F">動機</h3>
<ul>
<li>Stewart 平台以六支並聯腿決定上平台的六軸位姿，常見於動態模擬器與定位平台</li>
<li>本專案基於開源專案 <strong>knaufinator / 6DOF-Rotary-Stewart-Motion-Simulator</strong>（旋轉式致動）</li>
<li>原設計為全尺寸機構；目標是做出<strong>可在桌面驗證演算法</strong>的小型版本</li>
</ul>
<div class="kpi" style="margin-top:22px">
<div><b>2 代</b><span>實機迭代</span></div>
<div><b>6 DOF</b><span>x y z ／ roll pitch yaw</span></div>
<div><b>ESP32-C6</b><span>板上逆運動學</span></div>
</div>
</div>
<div>
<h3 id="%E8%A8%AD%E8%A8%88%E7%9B%AE%E6%A8%99">設計目標</h3>
<div class="card accent small">
<ol>
<li><strong>機構小型化</strong>：重新設計並開放 STL / STEP / SolidWorks 檔</li>
<li><strong>板上逆運動學</strong>：ESP32-C6 接收姿態、自行求解六軸角度</li>
<li><strong>上位機</strong>：六軸手動操作、各軸正弦測試、命令波形顯示</li>
<li><strong>安全機制</strong>：封包校驗、角度限制、通訊逾時回中位</li>
</ol>
</div>

<div class="caption">初代平台與舊版 3D 視覺化上位機</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="MINI STEWART PLATFORM" data-theme="stewart-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="3" style="--paginate:true;--footer:MINI STEWART PLATFORM;--theme:stewart-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h1 id="span-classnum02span%E5%85%AD%E8%87%AA%E7%94%B1%E5%BA%A6%E4%B8%A6%E8%81%AF%E6%A9%9F%E6%A7%8B%E5%8E%9F%E7%90%86"><span class="num">02</span>六自由度並聯機構原理</h1>
<h2 id="%E5%85%AD%E6%A2%9D%E6%97%8B%E8%BD%89%E6%90%96%E8%87%82%EF%BC%8B%E9%80%A3%E6%A1%BF%E9%96%89%E9%8F%88%E5%85%B1%E5%90%8C%E6%B1%BA%E5%AE%9A%E4%B8%8A%E5%B9%B3%E5%8F%B0%E4%BD%8D%E5%A7%BF">六條「旋轉搖臂＋連桿」閉鏈共同決定上平台位姿</h2>
<div class="cols-46">
<div>
<ul>
<li><strong>輸入</strong>：上平台位姿 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="bold">q</mi><mo>=</mo><mo stretchy="false">[</mo><mi>x</mi><mo separator="true">,</mo><mi>y</mi><mo separator="true">,</mo><mi>z</mi><mo separator="true">,</mo><msub><mi>ϕ</mi><mi>r</mi></msub><mo separator="true">,</mo><msub><mi>ϕ</mi><mi>p</mi></msub><mo separator="true">,</mo><mi>ψ</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">\mathbf{q}=[x,y,z,\phi_r,\phi_p,\psi]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6389em;vertical-align:-0.1944em;"></span><span class="mord mathbf">q</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.0361em;vertical-align:-0.2861em;"></span><span class="mopen">[</span><span class="mord mathnormal">x</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal">ϕ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0278em;">r</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal">ϕ</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">p</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">ψ</span><span class="mclose">]</span></span></span></span>，三平移、三旋轉</li>
<li><strong>每條腿</strong>：伺服搖臂 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>L</mi><mn>1</mn></msub></mrow><annotation encoding="application/x-tex">L_1</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">L</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> 旋轉 → 球頭連桿 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>L</mi><mn>2</mn></msub></mrow><annotation encoding="application/x-tex">L_2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal">L</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> 連到上平台接點</li>
<li><strong>並聯閉鏈</strong>：六腿同時承載，任一腿角度改變都會影響整體位姿</li>
<li><strong>逆運動學</strong>有逐腿封閉解：已知位姿 → 直接算出六個伺服角</li>
<li>正運動學（角度 → 位姿）需數值求解，本專案<strong>未實作</strong></li>
</ul>
<div class="kpi">
<div><b>6</b><span>伺服致動器</span></div>
<div><b>24 mm</b><span>搖臂 L₁</span></div>
<div><b>99 mm</b><span>連桿 L₂</span></div>
</div>
</div>
<div>

<h1 id="span-classnum05span%E5%BA%A7%E6%A8%99%E7%B3%BB%E7%B5%B1%E8%88%87%E5%A7%BF%E6%85%8B%E5%AE%9A%E7%BE%A9"><span class="num">05</span>座標系統與姿態定義</h1>
<h2 id="%E5%8E%9F%E9%BB%9E%E5%9C%A8%E5%BA%95%E5%BA%A7%E4%B8%AD%E5%BF%83z-%E8%BB%B8%E5%90%91%E4%B8%8A%E6%97%8B%E8%BD%89%E5%96%AE%E4%BD%8D%E7%82%BA%E5%BA%A6">原點在底座中心，z 軸向上；旋轉單位為度</h2>
<div class="cols-46">
<div>
<img src="assets/fig/geometry-top.png" alt="接點與座標俯視圖" style="width:100%" />
</div>
<div>
<p><strong>姿態向量</strong>（平移 mm、旋轉 °）</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="bold">q</mi><mo>=</mo><mo stretchy="false">[</mo><mtext> </mtext><mi>x</mi><mo separator="true">,</mo><mtext>  </mtext><mi>y</mi><mo separator="true">,</mo><mtext>  </mtext><mi>z</mi><mo separator="true">,</mo><mtext>  </mtext><mtext>roll</mtext><mo separator="true">,</mo><mtext>  </mtext><mtext>pitch</mtext><mo separator="true">,</mo><mtext>  </mtext><mtext>yaw</mtext><mtext> </mtext><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">\mathbf{q}=[\,x,\;y,\;z,\;\text{roll},\;\text{pitch},\;\text{yaw}\,]
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6389em;vertical-align:-0.1944em;"></span><span class="mord mathbf">q</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">x</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">y</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.044em;">z</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">roll</span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">pitch</span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord text"><span class="mord">yaw</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mclose">]</span></span></span></span></span></p><p><strong>旋轉矩陣</strong>（本實作 roll 繞 Y、pitch 繞 X）</p>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi>R</mi><mo>=</mo><msub><mi>R</mi><mi>z</mi></msub><mo stretchy="false">(</mo><mtext>yaw</mtext><mo stretchy="false">)</mo><mtext> </mtext><msub><mi>R</mi><mi>y</mi></msub><mo stretchy="false">(</mo><mtext>roll</mtext><mo stretchy="false">)</mo><mtext> </mtext><msub><mi>R</mi><mi>x</mi></msub><mo stretchy="false">(</mo><mtext>pitch</mtext><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">R = R_z(\text{yaw})\,R_y(\text{roll})\,R_x(\text{pitch})
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1.0361em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.044em;">z</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord text"><span class="mord">yaw</span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0359em;">y</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord text"><span class="mord">roll</span></span><span class="mclose">)</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">x</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord text"><span class="mord">pitch</span></span><span class="mclose">)</span></span></span></span></span></p><p><strong>平台中心</strong> <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mtext>  </mtext><mi>T</mi><mo>=</mo><mo stretchy="false">[</mo><mtext> </mtext><mi>x</mi><mo separator="true">,</mo><mtext>  </mtext><mi>y</mi><mo separator="true">,</mo><mtext>  </mtext><msub><mi>h</mi><mn>0</mn></msub><mo>+</mo><mi>z</mi><mtext> </mtext><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">\;T=[\,x,\;y,\;h_0+z\,]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">[</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">x</span><span class="mpunct">,</span><span class="mspace" styl <h1 id="span-classnum07span%E5%85%AD%E8%BB%B8%E8%87%B4%E5%8B%95%E5%99%A8%E6%8E%A7%E5%88%B6%E6%B5%81%E7%A8%8B"><span class="num">07</span>六軸致動器控制流程</h1>
<h2 id="%E5%BE%9E%E8%A7%92%E5%BA%A6%E5%88%B0-pca9685-%E8%A8%88%E6%95%B8%E5%80%BC%E6%AF%8F%E4%B8%80%E6%AD%A5%E9%83%BD%E5%9C%A8%E9%9F%8C%E9%AB%94%E5%85%A7">從角度到 PCA9685 計數值，每一步都在韌體內</h2>
<div class="cols" style="grid-template-columns:2.6fr 1fr;gap:20px">
<div class="frame"><img src="assets/diagrams/ik-workflow.png" alt="逆運動學流程圖" /></div>
<div class="small">
<div class="card" style="margin-bottom:10px;padding:10px 14px"><b>① 反轉與映射</b><br />CH0/2/4 取負號<br /><code>µs = 1500 + α/60·500</code><br />夾在 500–2500 µs</div>
<div class="card" style="margin-bottom:10px;padding:10px 14px"><b>② 逐通道校正</b><br />偏移 80,100,100,0,100,50 µs<br /><code>(µs+1.7)/0.935</code></div>
<div class="card" style="padding:10px 14px"><b>③ 輸出 PCA9685</b><br /><code>µs·4096/(10⁶/330)</code><br /><code>setPWM(ch,0,count)</code></div>
</div>
</div>
<div class="caption">Archify 流程圖：calculateServoAngles() 逐支求角，任一支失敗即整筆不套用</div>
<footer>MINI STEWART PLATFORM</footer>
</section>

<h1 id="span-classnum08span%E8%BB%9F%E9%AB%94%E6%9E%B6%E6%A7%8B%E8%88%87%E8%B3%87%E6%96%99%E6%B5%81"><span class="num">08</span>軟體架構與資料流</h1>
<h2 id="%E4%B8%8A%E4%BD%8D%E6%A9%9F%E7%94%A2%E7%94%9F%E5%91%BD%E4%BB%A4%E9%9F%8C%E9%AB%94%E8%B2%A0%E8%B2%AC%E9%A9%97%E8%AD%89%E8%A7%A3%E7%AE%97%E8%88%87%E5%AE%89%E5%85%A8%E5%9B%9E%E4%B8%AD">上位機產生命令，韌體負責驗證、解算與安全回中</h2>
<div class="cols-64">
<div class="frame"><img src="assets/diagrams/software-modules.png" alt="軟體模組資料流" /></div>
<div class="small">
<p><strong>通訊封包</strong>（ASCII，換行結尾，460800 baud）</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">$P,x,y,z,roll,pitch,yaw,checksum
</code></pre>
<ul>
<li>checksum ＝ Σ int(值×10) 取低 8 位</li>
<li>手動滑桿：實時送出最小間隔 <strong>50 ms</strong></li>
<li>正弦測試：更新頻率 <strong>10–300 Hz</strong> 可選</li>
<li>波形顯示每 <strong>100 ms</strong> 重繪（命令值）</li>
<li>封包組裝逾時 100 ms；<strong>1 s</strong> 無有效姿態 → 回中位</li>
<li><code>$V,0 / $V,1</code> 切換詳細回應</li>
</ul>
</div>
</div>
<footer>MINI STEWART PLATFORM</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="MINI STEWART PLATFORM" data-theme="stewart-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="10" style="--paginate:true;--footer:MINI STEWART PLATFORM;--theme:stewart-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h1 id="span-classnum09span%E9%81%8B%E5%8B%95%E6%A8%A1%E6%93%AC%E8%88%87%E5%AF%A6%E9%AB%94%E6%B8%AC%E8%A9%A6"><span class="num">09</span>運動模擬與實體測試</h1>
<h2 id="%E4%BB%A5%E9%9F%8C%E9%AB%94%E5%90%8C%E4%B8%80%E5%A5%97-ik-%E9%80%B2%E8%A1%8C-3d-%E6%A8%A1%E6%93%AC%E5%86%8D%E5%B0%8D%E7%85%A7%E5%AF%A6%E6%A9%9F%E9%81%8B%E8%A1%8C">以韌體同一套 IK 進行 3D 模擬，再對照實機運行</h2>
<div class="center"><img src="assets/fig/sim-3d.png" alt="三種姿態的 3D 模擬" style="height:350px" /></div>
<div class="cols" style="gap:24px;margin-top:6px">
<div class="small">
<p><strong>模擬自檢</strong>：三種姿態下，以解出的 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>α</mi><mi>i</mi></msub></mrow><annotation encoding="application/x-tex">\alpha_i</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5806em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0037em;">α</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3117em;"><span style="top:-2.55em;margin-left:-0.0037em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">i</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span> 重建搖臂端點，連桿長度與 99 mm 的誤差 &lt; 10⁻¹³ mm<br /><br />
<span class="muted">模擬為 Python 移植之韌體公式（presentations/assets/figures.py），非量測值</span></p>
</div>
<div class="small">
<p><strong>實體測試紀錄</strong>：初代與二代運行影片、負載測試照片<br /><br />
▶ <a href="https://github.com/ZHANG-XICHANG/Mini-Stewart-Platform/blob/main/docs/videos/v2-demo.mp4">二代運行影片</a>　▶ <a href="https://github.com/ZHANG-XICHANG/Mini-Stewart-Platform/blob/main/docs/videos/v1-demo.mp4">初代運行影片</a></p>
</div>
</div>
<footer>MINI STEWART PLATFORM</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="MINI STEWART PLATFORM" data-theme="stewart-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="11" style="--paginate:true;--footer:MINI STEWART PLATFORM;--theme:stewart-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h1 id="span-classnum10span%E5%AF%A6%E9%A9%97%E7%B5%90%E6%9E%9C%E8%88%87%E6%80%A7%E8%83%BD%E5%88%86%E6%9E%90"><span class="num">10</span>實驗結果與性能分析</h1>
<h2 id="%E7%90%86%E8%AB%96%E5%B7%A5%E4%BD%9C%E7%AF%84%E5%9C%8D%E5%B7%B2%E5%8F%AF%E8%A8%88%E7%AE%97%E7%A1%AC%E9%AB%94%E5%AE%9A%E9%87%8F%E6%95%B8%E6%93%9A%E4%BB%8D%E5%BE%85%E9%87%8F%E6%B8%AC">理論工作範圍已可計算；硬體定量數據仍待量測</h2>
<div class="cols-64">
<div>
<img src="assets/fig/workspace.png" alt="單軸可達範圍" style="width:100%" />
<div class="caption">由中立姿態單軸掃描（步距 0.05），IK 三項檢查皆通過的範圍｜虛線為 GUI 滑桿上限</div>
</div>
<div class="small">
<p><strong>模擬發現</strong>：z、roll、pitch 的可達範圍小於 GUI 滑桿上限，超出時韌體回報 IK 失敗、不動作</p>
<table>
<thead>
<tr>
<th>指標</th>
<th>結果</th>
</tr>
</thead>
<tbody>
<tr>
<td>實機運行（兩代）</td>
<td><span class="ok">已完成</span></td>
</tr>
<tr>
<td>重複定位精度</td>
<td><span class="tbd">待補</span></td>
</tr>
<tr>
<td>最大負載</td>
<td><span class="tbd">待補</span></td>
</tr>
<tr>
<td>正弦追蹤誤差 / 頻寬</td>
<td><span class="tbd">待補</span></td>
</tr>
<tr>
<td>實際封包率</td>
<td><span class="tbd">待補</span></td>
</tr>
</tbody>
</table>
<p><span class="muted">韌體已內建 <code>[ESP32-PERF]</code> 每 5 s 統計封包率與 IK 失敗數，可作為量測起點</span></p>
</div>
</div>
<footer>MINI STEWART PLATFORM</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="MINI STEWART PLATFORM" data-theme="stewart-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="12" style="--paginate:true;--footer:MINI STEWART PLATFORM;--theme:stewart-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h1 id="span-classnum11span%E9%96%8B%E7%99%BC%E9%81%8E%E7%A8%8B%E4%B8%AD%E7%9A%84%E6%8A%80%E8%A1%93%E6%8C%91%E6%88%B0"><span class="num">11</span>開發過程中的技術挑戰</h1>
<h2 id="%E6%95%B8%E5%AD%B8%E6%AD%A3%E7%A2%BA%E6%80%A7%E7%A1%AC%E9%AB%94%E5%B7%AE%E7%95%B0%E8%88%87%E5%8D%94%E5%AE%9A%E7%9B%B8%E5%AE%B9">數學正確性、硬體差異與協定相容</h2>
<div class="cols">
<div class="card warn small">
<h3 id="%E6%97%8B%E8%BD%89%E7%9F%A9%E9%99%A3%E9%8C%AF%E8%AA%A4%E5%B7%B2%E4%BF%AE%E6%AD%A3">旋轉矩陣錯誤（已修正）</h3>
<p>沿用的展開式第二列把 <code>cos(roll)</code> 與 <code>cos(pitch)</code> 對調，矩陣<strong>不正交</strong>。改為標準 <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>R</mi><mi>z</mi></msub><msub><mi>R</mi><mi>y</mi></msub><msub><mi>R</mi><mi>x</mi></msub></mrow><annotation encoding="application/x-tex">R_z R_y R_x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.9694em;vertical-align:-0.2861em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.044em;">z</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0359em;">y</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.2861em;"><span></span></span></span></span></span></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0077em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">x</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span>（commit <code>2376aef</code>）。</p>
<table>
<thead>
<tr>
<th>單軸傾斜</th>
<th>5°</th>
<th>10°</th>
<th>15°</th>
</tr>
</thead>
<tbody>
<tr>
<td>伺服角最大差</td>
<td>0.07°</td>
<td>0.30°</td>
<td>0.72°</td>
</tr>
</tbody>
</table>
<p><span class="muted">中立、平移與純 yaw 不受影響；修正後韌體 <span class="tbd">待重新燒錄實測</span></span></p>
</div>
<div class="small">
<div class="card" style="margin-bottom:12px">
<p><strong>伺服個體差異</strong> → 逐通道偏移 ＋ PCA 輸出校正（scale 0.935）；數值只適用原實機</p>
</div>
<div class="card" style="margin-bottom:12px">
<p><strong>兩套協定並存</strong> → 主版 <code>$P</code> 姿態 460800 baud；舊版 12-byte 角度 115200 baud，分目錄隔離</p>
</div>
<div class="card">
<p><strong>浮點校驗邊界</strong> → 韌體單精度、上位機雙精度，<code>int(v×10)</code> 截斷在小數邊界可能不一致 <span class="tbd">待實測</span></p>
</div>
</div>
</div>
<footer>MINI STEWART PLATFORM</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="MINI STEWART PLATFORM" data-theme="stewart-dark" data-lang="zh-TW" lang="zh-TW" data-marpit-pagination="13" style="--paginate:true;--footer:MINI STEWART PLATFORM;--theme:stewart-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h1 id="span-classnum12span%E6%94%B9%E5%96%84%E6%96%B9%E6%A1%88%E8%88%87%E7%A0%94%E7%A9%B6%E5%BB%B6%E4%BC%B8"><span class="num">12</span>改善方案與研究延伸</h1>
<h2 id="%E5%BE%9E%E9%96%8B%E8%BF%B4%E8%B7%AF%E5%91%BD%E4%BB%A4%E8%B5%B0%E5%90%91%E5%8F%AF%E9%87%8F%E6%B8%AC%E5%8F%AF%E9%A9%97%E8%AD%89%E7%9A%84%E9%96%89%E8%BF%B4%E8%B7%AF%E5%B9%B3%E5%8F%B0">從開迴路命令走向可量測、可驗證的閉迴路平台</h2>
<div class="cols-3">
<div class="card accent">
<h3 id="%E9%87%8F%E6%B8%AC%E8%88%87%E9%A9%97%E8%AD%89">量測與驗證</h3>
<ul>
<li>上平台加 IMU，量測實際姿態</li>
<li>建立重複定位、負載、頻率響應測試流程</li>
<li>以 <code>[ESP32-PERF]</code> 記錄封包率與 IK 失敗率</li>
</ul>
</div>
<div class="card accent">
<h3 id="%E6%8E%A7%E5%88%B6%E8%88%87%E5%AE%89%E5%85%A8">控制與安全</h3>
<ul>
<li>GUI 依模擬工作空間限制輸入</li>
<li>速度 / 加速度限制與軌跡平滑</li>
<li>硬體急停：切斷伺服電源</li>
<li>checksum 改為定點整數或 CRC-8</li>
</ul>
</div>
<div class="card accent">
<h3 id="%E7%A0%94%E7%A9%B6%E5%BB%B6%E4%BC%B8">研究延伸</h3>
<ul>
<li>數值正運動學（Newton–Raphson）</li>
<li>姿態閉迴路控制（PID / LQR）</li>
<li>應用：球平衡、相機穩定、動態模擬</li>
</ul>
</div>
</div>
<div class="kpi small" style="margin-top:20px">
<div><b>短期</b><span>重新燒錄並實測旋轉修正、GUI 範圍限制、checksum 定點化</span></div>
<div><b>中期</b><span>IMU 量測與定量測試：精度、負載、頻率響應</span></div>
<div><b>長期</b><span>姿態閉迴路控制與應用驗證</span></div>
</div>
<div class="caption" style="margin-top:12px">以上為規劃方向，尚未實作</div>
<footer>MINI STEWART PLATFORM</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="MINI STEWART PLATFORM" data-class="closing" data-theme="stewart-dark" data-lang="zh-TW" lang="zh-TW" class="closing" data-marpit-pagination="14" style="--paginate:true;--footer:MINI STEWART PLATFORM;--class:closing;--theme:stewart-dark;--lang:zh-TW;" data-marpit-pagination-total="15" data-size="16:9">
<h1 id="span-classnum13span%E7%B5%90%E8%AB%96%E8%88%87%E6%88%90%E6%9E%9C%E5%B1%95%E7%A4%BA"><span class="num">13</span>結論與成果展示</h1>
<div class="cols-46">
<div>

<li>以模擬算出單軸工作範圍，定位 GUI 與機構的落差</li>
